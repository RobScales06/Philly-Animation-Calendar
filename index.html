<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Philadelphia Animation Calendar</title>
  <meta name="description" content="A public calendar of animation, illustration, and visual arts events in Philadelphia." />

  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, Segoe UI, Roboto, Helvetica, Arial, sans-serif;
      margin: 0;
      background: #fff;
      color: #111;
    }

    .container {
      max-width: 760px;
      margin: 0 auto;
      padding: 48px 20px;
    }

    h1 {
      font-size: 28px;
      margin-bottom: 6px;
    }

    .subtitle {
      color: #555;
      font-size: 14px;
      margin-bottom: 6px;
    }

    .meta {
      color: #888;
      font-size: 13px;
      margin-bottom: 24px;
    }

    .actions {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
      margin-bottom: 40px;
    }

    a.button {
      padding: 10px 14px;
      border: 1px solid #ddd;
      border-radius: 6px;
      text-decoration: none;
      color: #111;
      font-size: 14px;
    }

    a.button:hover {
      border-color: #999;
    }

    h2 {
      font-size: 16px;
      margin-top: 40px;
      margin-bottom: 12px;
    }

    .event {
      padding: 12px 0;
      border-top: 1px solid #eee;
    }

    .title {
      font-weight: 600;
    }

    .meta-line {
      font-size: 13px;
      color: #666;
      margin-top: 2px;
    }

    .desc {
      font-size: 13px;
      color: #444;
      margin-top: 4px;
      white-space: pre-wrap;
    }

    footer {
      margin-top: 60px;
      padding-top: 20px;
      border-top: 1px solid #eee;
      font-size: 12px;
      color: #888;
    }
  </style>
</head>

<body>
  <div class="container">

    <h1>Philadelphia Animation Calendar</h1>

    <div class="subtitle">
      A public calendar of animation, illustration, and visual arts events in Philadelphia.
    </div>

    <div class="meta">
      Maintained by Rob Scales
    </div>

    <div class="actions">
      <a class="button" href="https://calendar.google.com/calendar/embed?src=c21b50cbe54cfc926278e1811d43f7ce7fb975b6fbd829e70a9f5d69658a6f8f%40group.calendar.google.com&ctz=UTC">
        Subscribe in Google Calendar
      </a>
      <a class="button" href="https://docs.google.com/forms/d/e/1FAIpQLSeUQPjB5qZCMQcCMJegnICuXmwcc7A3X5EAp2gC4n7TcRMUaA/viewform?usp=header">
        Submit an Event
      </a>
    </div>

    <h2>Upcoming Events</h2>
    <div id="events">Loading events...</div>

    <footer>
      Subscribe via Google Calendar · Submit via form<br/>
      Philadelphia, PA
    </footer>

  </div>

  <script src="calendar.js"></script>
</body>
</html>
